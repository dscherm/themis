[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-blind-tdd"
version = "0.1.0"
description = "A blind TDD gate: the agent that writes the acceptance tests never sees the implementation. Independence-by-construction verification for AI-written code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dan Schermele" }]
keywords = ["tdd", "bdd", "llm", "ai-agents", "verification", "test-first", "claude-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# The Agent-SDK spawner is optional; the default ClaudeCodeSpawner shells out to `claude -p`.
sdk = ["claude-agent-sdk"]
dev = ["pytest"]

[project.scripts]
themis-probes = "blind_tdd.probes:main"

[tool.setuptools]
packages = ["blind_tdd", "blind_tdd.spawners"]

[tool.pytest.ini_options]
testpaths = ["blind_tdd"]
addopts = "-q"
